[build]
  command = "node build.mjs"
  publish = "dist"
[build.environment]
  SITE_URL = "https://oneofthem-group.com"
[build.processing.html]
  pretty_urls = true
[functions]
  directory = "netlify/functions"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
